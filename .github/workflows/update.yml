name: Update fuel price

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scrape.py
      - name: Commit if prices changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet -- docs/data.json; then
            echo "가격 변동 없음"
          else
            git commit -m "Update fuel price $(date -u +%F)"
            git push
          fi
